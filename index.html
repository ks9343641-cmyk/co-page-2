<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meri CEO ke liye 💌</title>
<style>
  html { --ground:5px; }
  html, body { margin:0; height:100%; overflow:hidden; background:#FFF0F5; }

  /* ---------- Text (beech mein) ---------- */
  #stage {
    position:absolute; inset:0; z-index:2;
    display:flex; align-items:center; justify-content:center;
    padding:24px 24px 24vh; box-sizing:border-box;
  }
  #code {
    max-width:640px; width:100%;
    font-family:"Georgia","Times New Roman",serif;
    font-size:clamp(17px,2.4vw,24px);
    line-height:1.8; color:#8b2e4a;
    white-space:pre-wrap; text-align:center;
  }
  .cursor {
    display:inline-block; width:2px; height:1.1em; background:#e84393;
    vertical-align:text-bottom; margin-left:2px;
    animation:blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity:0; } }

  /* ---------- Leaves canvas ---------- */
  canvas { position:fixed; inset:0; pointer-events:none; }
  #leavesBack  { z-index:1; }
  #leavesFront { z-index:3; }

  /* ---------- Ground line ---------- */
  #ground { top:auto; right:auto; left:0; bottom:0; z-index:3; }

  /* ---------- Buddy (bottom-left) ---------- */
  #buddy {
    position:fixed; left:10px; bottom:var(--ground); height:clamp(260px,46vh,400px); aspect-ratio:174/560;
    z-index:4; opacity:0; pointer-events:none;
    transition:opacity 3.2s ease;
  }
  #buddy.show { opacity:1; }
  #buddy-img { width:100%; height:100%; display:block; }

  .bubble {
    position:absolute; left:70%; bottom:calc(100% + 40px); width:190px;
    background:#fff; border:3px solid #fd79a8; border-radius:40px;
    padding:12px 16px; text-align:center;
    font-family:"Segoe UI",sans-serif; font-size:15px; color:#c0392b;
    opacity:0; transition:opacity 1.5s ease 0.8s;
  }
  #buddy.show .bubble { opacity:1; }
  /* cloud wali choti goliyan */
  .bubble::before, .bubble::after {
    content:""; position:absolute; background:#fff; border:3px solid #fd79a8; border-radius:50%;
  }
  .bubble::before { width:14px; height:14px; left:6px; bottom:-20px; }
  .bubble::after  { width:8px;  height:8px;  left:-6px; bottom:-34px; }

  /* ---------- Billi gif ---------- */
  #cat {
    position:fixed; right:-30px; bottom:var(--ground); width:300px; height:281px; overflow:hidden; z-index:4;
    opacity:0; pointer-events:none; transition:opacity 3.2s ease 0.8s;
  }
  #cat img { position:absolute; left:0; top:0; width:300px; height:300px; max-width:none; }
  #cat.show { opacity:1; }
  .bubble-text { display:inline-block; transition:opacity .6s ease; }
</style>
</head>
<body>

<canvas id="leavesBack"></canvas>

<div id="stage">
  <div id="code"></div>
</div>

<canvas id="leavesFront"></canvas>
<canvas id="ground"></canvas>

<div id="buddy">
  <div class="bubble"><span class="bubble-text"> hey yo assalamualaikum CEO 🥱</span></div>
  <picture>
    <source srcset="buddy.webp" type="image/webp">
    <img id="buddy-img" src="buddy.png" alt="">
  </picture>
</div>
<div id="cat"><img src="mewmew.gif" alt=""></div>

<script>
/* =====================================================
   1) TYPEWRITER  -  yahan apna text badal
   ===================================================== */
const TEXT = `hmmm😮‍💨.....chalo dekhte hai meri ceo ke liye kya likh sakta hu mai`;

const TYPE_SPEED  = 55;    // ms per letter (kam = tez)
const BUDDY_DELAY = 1000;  // text poora hone ke kitni der baad buddy + billi aaye

const box = document.getElementById('code');
const cursor = document.createElement('span');
cursor.className = 'cursor';
box.appendChild(cursor);

const chars = Array.from(TEXT);   // emoji ko sahi se todta hai
let i = 0;

function type() {
  if (i < chars.length) {
    cursor.before(document.createTextNode(chars[i]));
    const ch = chars[i++];
    // . , aur nayi line pe thoda ruk jaye
    const pause = ('.,\n'.includes(ch)) ? 220 : 0;
    setTimeout(type, TYPE_SPEED + pause);
  } else {
    setTimeout(() => {
      document.getElementById('buddy').classList.add('show');
      document.getElementById('cat').classList.add('show');

      const bt = document.querySelector('.bubble-text');

      // text fade-out, badlo, fade-in
      function changeText(newText) {
        bt.style.opacity = 0;
        setTimeout(() => {
          bt.textContent = newText;
          bt.style.opacity = 1;
        }, 600);
      }

      setTimeout(() => changeText('kya haal hai ladli fir se aa gaye hai hum 😅💕'), 5000);   // buddy aane ke 5 second baad
      setTimeout(() => changeText('Chalo tumhare liye kuch likha hai dikhata hu 🥰✨'), 15000);  // doosre text ke 10 second baad

      // teesra text padhne ke liye 4 second, phir naya page
      setTimeout(() => {
        document.body.style.transition = 'opacity 1s ease';
        document.body.style.opacity = 0;
        setTimeout(() => { window.location.href = 'page2.html'; }, 1000);
      }, 19000);                                                          // teesre text ke 4 second baad

    }, BUDDY_DELAY);
  }
}
type();

/* =====================================================
   GROUND LINE  -  beech se dono taraf badhti hai
   ===================================================== */
(function () {
  const THICK = 5, SPEED = 10;          // SPEED badha = line jaldi bani
  const cv = document.getElementById('ground');
  const g = cv.getContext('2d');
  let len = 0, done = false;

  function paint() {
    g.clearRect(0, 0, cv.width, cv.height);
    g.strokeStyle = '#8B5A2B';
    g.lineWidth = THICK;
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(cv.width / 2 - len / 2, THICK / 2);
    g.lineTo(cv.width / 2 + len / 2, THICK / 2);
    g.stroke();
  }
  function size() {
    cv.width = innerWidth; cv.height = THICK;
    if (done) len = cv.width + 40;      // animation ho chuka hai to line hamesha poori screen pe
    paint();
  }
  function grow() {
    paint();
    if (len < cv.width + 40) { len += SPEED; requestAnimationFrame(grow); }
    else { done = true; len = cv.width + 40; paint(); }
  }
  addEventListener('resize', size);
  size();
  setTimeout(grow, 300);
})();

/* =====================================================
   2) WIND LEAVES  —  udte hue heart patte
   ===================================================== */
const WIND_DENSITY = 1.4;  // zyada = zyada patte
const WIND_SPEED   = 1;    // 0.7 slow, 1 normal, 1.3 fast
const COLORS = ['#ff6b81','#ff4757','#e84393','#fd79a8','#c0392b','#eb2f06'];

const back  = document.getElementById('leavesBack');
const front = document.getElementById('leavesFront');
const bctx = back.getContext('2d');
const fctx = front.getContext('2d');
let W, H, leaves = [];

function resize() {
  W = back.width = front.width = innerWidth;
  H = back.height = front.height = innerHeight;
  build();
}

function build() {
  const base  = Math.min(46, Math.max(16, Math.round(W * H / 30000)));
  const total = Math.round(base * WIND_DENSITY);
  const nBack = Math.round(total * 0.65);
  leaves = [];
  for (let k = 0; k < total; k++) leaves.push(newLeaf(k < nBack ? 'back' : 'front', true));
}

function newLeaf(layer, first) {
  const isFront = layer === 'front';
  return {
    layer,
    x: Math.random() * W,
    y: first ? Math.random() * H : -30,
    size:  isFront ? 7 + Math.random() * 7  : 10 + Math.random() * 14,
    fall:  (0.4 + Math.random() * 0.7) * WIND_SPEED,
    swayAmp: 0.4 + Math.random() * 0.8,
    swayFreq: 0.6 + Math.random() * 1.0,
    phase: Math.random() * 6.28,
    rot: Math.random() * 6.28,
    rotSpeed: (Math.random() - 0.5) * 0.03,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    alpha: isFront ? 0.7 + Math.random() * 0.15 : 0.55 + Math.random() * 0.4,
    birth: Math.random() * 3000      // 3 second mein dheere-dheere dikhne lagte hain
  };
}

function heart(ctx, s) {
  ctx.beginPath();
  ctx.moveTo(0, s * 0.35);
  ctx.bezierCurveTo(-s * 1.1, -s * 0.3, -s * 0.5, -s * 1.0, 0, -s * 0.4);
  ctx.bezierCurveTo( s * 0.5, -s * 1.0,  s * 1.1, -s * 0.3, 0, s * 0.35);
  ctx.closePath();
  ctx.fill();
}

const t0 = performance.now();
function frame(now) {
  const t = now - t0;
  bctx.clearRect(0, 0, W, H);
  fctx.clearRect(0, 0, W, H);

  // dheere gusts: kabhi tez, kabhi shaant
  const gust = Math.max(0, Math.sin(t / 5000)) ;
  const wind = (Math.sin(t / 3500) * 0.5 + 0.4 + gust * 0.9) * WIND_SPEED;

  for (const l of leaves) {
    const age = t - l.birth;
    if (age < 0) continue;
    const fade = Math.min(1, age / 1500);

    l.y += l.fall - gust * (1 / l.size) * 6;                    // halke patte gust mein thoda upar
    l.x += wind * 0.9 + Math.sin(t / 1000 * l.swayFreq + l.phase) * l.swayAmp;
    l.rot += l.rotSpeed;

    if (l.y > H + 30) Object.assign(l, newLeaf(l.layer, false), { birth: t });
    if (l.x > W + 30) l.x = -30;
    if (l.x < -30)    l.x = W + 30;

    const ctx = l.layer === 'back' ? bctx : fctx;
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.rot);
    ctx.scale(Math.cos(t / 700 * l.swayFreq + l.phase) * 0.35 + 0.75, 1); // palatne jaisa squash
    ctx.globalAlpha = l.alpha * fade;
    ctx.fillStyle = l.color;
    heart(ctx, l.size);
    ctx.restore();
  }
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
